# Deploys the Node static-site + presence server to Azure Web App - wanderersweb
# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy

name: Deploy Node app to Azure Web App - wanderersweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A3979CA36959402A8F6B06E3D5298F6F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_BAA31F75426A4FE2AAEBDC9252336BFF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B563455731C040BEB8E94756A9EC1C72 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'wanderersweb'
          slot-name: 'Production'
          package: .
