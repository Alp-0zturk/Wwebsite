# Deploys the Node static-site + presence server to Azure Web App - Wanderers-website
# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy

name: Deploy Node app to Azure Web App - Wanderers-website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2980C37D8B434DC6876710D34C16A040 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C96EF114B4EB41E785B8269D11F6818C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3BE1E27054324F72BB168F6226B850C9 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Wanderers-website'
          slot-name: 'Production'
          package: .
